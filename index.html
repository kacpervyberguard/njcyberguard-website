<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NJ CyberGuard | Network & Security Solutions</title>
  <style>
    /* ── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #1a1a2e;
      background: #ffffff;
      line-height: 1.6;
    }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; }

    /* ── Colors ───────────────────────────────────────────────── */
    :root {
      --navy:   #0d1b3e;
      --blue:   #1a55af;
      --sky:    #3b82f6;
      --accent: #e8f0fe;
      --light:  #f7f9ff;
      --gray:   #64748b;
      --border: #e2e8f0;
      --white:  #ffffff;
    }

    /* ── Utility ──────────────────────────────────────────────── */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--blue);
      color: #fff;
      border: 2px solid var(--blue);
    }
    .btn-primary:hover { background: #1447a0; border-color: #1447a0; }
    .btn-outline {
      background: transparent;
      color: var(--blue);
      border: 2px solid var(--blue);
    }
    .btn-outline:hover { background: var(--blue); color: #fff; }
    .section-label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sky);
      margin-bottom: 8px;
    }
    .section-title {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 700;
      color: var(--navy);
      line-height: 1.25;
    }
    .section-sub {
      color: var(--gray);
      font-size: 1.05rem;
      margin-top: 12px;
      max-width: 560px;
    }
